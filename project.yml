name: ControlGallery
options:
  bundleIdPrefix: com.breastdressing
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_PREVIEWS: YES

targets:
  ControlGallery:
    type: application
    platform: iOS
    sources:
      - path: Sources/ControlGallery
    info:
      path: Sources/ControlGallery/Info.plist
      properties:
        CFBundleDisplayName: 控件图鉴
        CFBundleName: ControlGallery
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.breastdressing.controlgallery
        PRODUCT_NAME: ControlGallery
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  ControlGalleryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ControlGalleryTests
    dependencies:
      - target: ControlGallery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.breastdressing.controlgallery.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ControlGallery:
    build:
      targets:
        ControlGallery: all
        ControlGalleryTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: ControlGalleryTests
    archive:
      config: Release
